# Grobes Request-Limit pro Client-IP für den SSO-vhost (zusätzlich zu den Limits in der App).
# 20 Requests/s, Burst 100: reicht für normale Seitenaufrufe, bremst Brute-Force-Skripte.
# Einbinden: nach /etc/nginx/conf.d/ kopieren (http-Kontext).
limit_req_zone $binary_remote_addr zone=sso_general:10m rate=20r/s;
