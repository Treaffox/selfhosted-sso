# ── SSO-Cookies nicht an geschützte Apps weiterreichen ────────────────────
# Nur relevant für Apps hinter nginx auth_request. Hat der Session-Cookie (sso_session) eine
# COOKIE_DOMAIN wie ".example.com", geht er an JEDE Subdomain. Apps hinter auth_request brauchen ihn nicht:
# nginx prüft ihn selbst per Subrequest. Würde er an die App durchgereicht, könnte eine kompromittierte App
# die SSO-Session (bei Admins: den Zugang zur Verwaltung) übernehmen.
#
# Nutzung (conf.d/, http-Kontext) – in den proxy-Locations der geschützten App:
#     proxy_set_header Cookie $cookie_without_sso;
# Im auth_request-Subrequest bleibt es bei:  proxy_set_header Cookie $http_cookie;
#
# Entfernt sso_session, sso_trusted und sso_guest (Gast-Zugang, siehe /settings/sessions) an beliebiger
# Stelle im Header, alle übrigen Cookies der App bleiben unverändert. Ein leeres Ergebnis lässt nginx
# den Header weg.

map $http_cookie $cookie_no_session {
    default $http_cookie;
    "~^(?<pre>(?:.*;\s*)?)sso_session=[^;]*(?:;\s*(?<post>.*))?$" "$pre$post";
}

map $cookie_no_session $cookie_no_trusted {
    default $cookie_no_session;
    "~^(?<pre2>(?:.*;\s*)?)sso_trusted=[^;]*(?:;\s*(?<post2>.*))?$" "$pre2$post2";
}

map $cookie_no_trusted $cookie_without_sso {
    default $cookie_no_trusted;
    "~^(?<pre3>(?:.*;\s*)?)sso_guest=[^;]*(?:;\s*(?<post3>.*))?$" "$pre3$post3";
}
